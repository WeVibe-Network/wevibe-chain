syntax = "proto3";
package wevibe.org.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/org/types";

import "cosmos/msg/v1/msg.proto";
import "wevibe/org/v1/params.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc RegisterOrg(MsgRegisterOrg) returns (MsgRegisterOrgResponse);
  rpc AddMember(MsgAddMember) returns (MsgAddMemberResponse);
  rpc RemoveMember(MsgRemoveMember) returns (MsgRemoveMemberResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc SetOrgConfig(MsgSetOrgConfig) returns (MsgSetOrgConfigResponse);
  rpc GrantTrialAllowance(MsgGrantTrialAllowance) returns (MsgGrantTrialAllowanceResponse);
  rpc UpdateMemberRole(MsgUpdateMemberRole) returns (MsgUpdateMemberRoleResponse);
  rpc RotateEpoch(MsgRotateEpoch) returns (MsgRotateEpochResponse);
  rpc TransferLeadership(MsgTransferLeadership) returns (MsgTransferLeadershipResponse);
  rpc CloseOrg(MsgCloseOrg) returns (MsgCloseOrgResponse);
  rpc SetServingKey(MsgSetServingKey) returns (MsgSetServingKeyResponse);
  rpc SetServingInfo(MsgSetServingInfo) returns (MsgSetServingInfoResponse);
}

message MsgRegisterOrg {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  reserved 2;
  reserved "org_id";
  string leader = 3;
  uint64 storage_quota = 4;
  uint64 retrieval_budget = 5;
  string domain = 6;
  // CO-044 (D-S32-CO044-KEY-SEPARATION): the per-org hub serving key chain
  // address (signs serves/denials only) and the leader's chain wallet address
  // (the on-chain authority for org decisions).
  string hub_serving_key = 7;
  string leader_wallet = 8;
  string description = 9;
  string tech_stack = 10;
  string focus_areas = 11;
  string name = 12;
}

message MsgRegisterOrgResponse {
  string org_id = 1;
}

// CO-044: rotate/revoke the org's hub serving key. Authorized by the leader's
// chain wallet (msg.signer must equal the org's leader_wallet_address).
message MsgSetServingKey {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  string new_serving_key = 3;
}

message MsgSetServingKeyResponse {}

message MsgSetServingInfo {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1; // leader's secp256k1 chain wallet (Bech32)
  string org_id = 2;
  repeated string hub_endpoints = 3; // ordered 1-3 transport URLs (D-CHAIN-RESOLVED-HUB-ENDPOINT)
  string hub_response_pubkey = 4; // optional lowercase hex ed25519 pubkey (32 bytes)
}

message MsgSetServingInfoResponse {}

message MsgAddMember {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  string pubkey = 3;
  string role = 4;
  string x25519_pubkey = 5;
}

message MsgAddMemberResponse {}

message MsgRemoveMember {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  string pubkey = 3;
}

message MsgRemoveMemberResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}

message MsgUpdateParamsResponse {}

message MsgSetOrgConfig {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  bool serve_attestation_required = 3;
  uint64 min_contributions_per_epoch = 4;
  uint64 contest_stake_vibe = 5;
  string vocab_hash = 6;
  string embedding_model_id = 7;
}
message MsgSetOrgConfigResponse {}

message MsgGrantTrialAllowance {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  string grantee = 3;
  uint64 daily_submissions = 4;
  uint64 trial_days = 5;
}
message MsgGrantTrialAllowanceResponse {}

message MsgUpdateMemberRole {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  string pubkey = 3;
  string new_role = 4;
}
message MsgUpdateMemberRoleResponse {}

message MsgRotateEpoch {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
}
message MsgRotateEpochResponse {
  uint64 new_epoch = 1;
}

message MsgTransferLeadership {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  string new_leader = 3;
  string new_leader_wallet = 4;
}
message MsgTransferLeadershipResponse {}

message MsgCloseOrg {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
}
message MsgCloseOrgResponse {}

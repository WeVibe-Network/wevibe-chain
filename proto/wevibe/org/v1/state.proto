syntax = "proto3";
package wevibe.org.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/org/types";

message StoredOrg {
  string org_id = 1;
  string leader = 2;
  uint64 created_at = 3;
  uint64 renewal_height = 4;
  uint64 storage_quota = 5;
  uint64 retrieval_budget = 6;
  int32 status = 7;
  string domain = 8;
  uint64 total_committed_memories = 9;
  uint64 total_active_members = 10;
  uint64 total_epoch_rotations = 11;
  uint64 total_upheld_reports = 12;
  uint64 last_activity_epoch = 13;
  // CO-044 (D-S32-CO044-KEY-SEPARATION): the per-org hub serving key's chain
  // address. The ONLY signer authorized to submit serve/denial batches for this
  // org. Leader-rotatable via MsgSetServingKey.
  string hub_serving_address = 14;
  // CO-044: the leader's chain wallet address (secp256k1 authority, distinct
  // from `leader` which is the ed25519 member pubkey). The on-chain authority
  // for org-decision messages; the signer that may rotate the serving key.
  string leader_wallet_address = 15;
  uint64 slot = 16;
  string account_address = 17;
  // D-CHAIN-RESOLVED-HUB-ENDPOINT: ordered 1-3 transport URLs (replicas
  // fronting hub_serving_address); leader-set; resolved by clients as the
  // org directory.
  repeated string hub_endpoints = 18;
  // D-HUB-RESPONSE-SIGNED: hex ed25519 pubkey of the hub's dedicated
  // response-signing key (INTEGRITY); distinct from hub_serving_address
  // (secp256k1 AUTH).
  string hub_response_pubkey = 19;
  string description = 20;
  string tech_stack = 21;
  string focus_areas = 22;
  string name = 23;
}

message StoredSlotRegistry {
  uint64 next_slot = 1;
}

message StoredMemberRecord {
  string org_id = 1;
  string pubkey = 2;
  string role = 3;
  string x25519_pubkey = 4;
}

message StoredOrgConfig {
  string org_id = 1;
  bool serve_attestation_required = 2;
  reserved 3;
  uint64 contest_stake_vibe = 4;
  string vocab_hash = 5;
  string embedding_model_id = 6;
  uint64 min_contributions_per_epoch = 10;
}

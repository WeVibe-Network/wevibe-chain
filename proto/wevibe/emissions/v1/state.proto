syntax = "proto3";
package wevibe.emissions.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/emissions/types";

message StoredEmissionPool {
  uint64 total_supply = 1;
  uint64 daily_mint = 2;
  uint64 operator_share = 3;
  uint64 validator_share = 4;
  uint64 epoch = 5;
  // CO-041 32-year schedule pool tracking.
  uint64 validator_pool_remaining_uvibe = 6;
  uint64 contributor_pool_remaining_uvibe = 7;
  uint64 contributor_rollover_uvibe = 8;
  uint64 start_epoch = 9;
  uint64 total_epochs_elapsed = 10;
}

message StoredDailyEmission {
  uint64 epoch = 1;
  uint64 total_emitted = 2;
  uint64 validator_share = 4;
}

message StoredBootstrapCredit {
  string operator_id = 1;
  uint64 credits = 2;
  uint64 redeemed = 3;
}

message StoredAsymmetricGate {
  string operator_id = 1;
  string org_id = 2;
  bool storage_passed = 3;
  bool retrieval_allowed = 4;
  uint64 epoch = 5;
}

syntax = "proto3";
package wevibe.identity.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/identity/types";

import "cosmos/msg/v1/msg.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc MigrateIdentity(MsgMigrateIdentity) returns (MsgMigrateIdentityResponse);
}

message MsgMigrateIdentity {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;            // wallet bech32 — the cosmos tx signer (secp256k1)
  string passkey_pubkey = 2;    // ed25519 hex
  string passkey_signature = 3; // ed25519 sig hex over the canonical migrate message
  uint64 nonce = 4;
}

message MsgMigrateIdentityResponse {}

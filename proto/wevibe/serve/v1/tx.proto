syntax = "proto3";
package wevibe.serve.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/serve/types";

import "cosmos/msg/v1/msg.proto";
import "wevibe/serve/v1/params.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc SubmitServeBatch(MsgSubmitServeBatch) returns (MsgSubmitServeBatchResponse);
  rpc SubmitDenialBatch(MsgSubmitDenialBatch) returns (MsgSubmitDenialBatchResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message ServeEntry {
  bytes memory_content_hash = 1;
  reserved 2;
  reserved "serve_key";
  string contributor_id = 3;
  reserved 4;
  reserved "nullifier";
  string model_id = 5;
  uint32 turn_count = 6;
  string contributor_wallet = 7;
  // Matched-keyword set for this serve event - the intersection of the
  // memory's keywords and the query's keyword set. Required, non-empty.
  // Per D-4.2 Implementation Clarifications (DMO-007).
  repeated string matched_keywords = 8;
  bytes serve_key_pubkey = 9;
  bytes serve_sig = 10;
  bytes nonce = 11;
}

message MsgSubmitServeBatch {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  uint64 epoch = 3;
  repeated ServeEntry serves = 4;
}

message MsgSubmitServeBatchResponse {
  uint64 accepted = 1;
  uint64 rejected_duplicate = 2;
  uint64 rejected_invalid = 3;
}

message DenialEntry {
  bytes memory_hash = 1;
  reserved 2;
  reserved "nullifier";
  reserved 3;
  reserved "deny_key";
  string reason = 4;
  bytes serve_key_pubkey = 5;
  bytes serve_sig = 6;
  bytes serve_fingerprint = 7;
  bytes nonce = 8;
}

message MsgSubmitDenialBatch {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  uint64 epoch = 3;
  repeated DenialEntry entries = 4;
}

message MsgSubmitDenialBatchResponse {
  uint64 accepted = 1;
  uint64 rejected = 2;
}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}

message MsgUpdateParamsResponse {}

syntax = "proto3";
package wevibe.serve.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/serve/types";

// E1 serve event record (RECALL-PIVOT-SPEC §3.1).
message StoredServeReceipt {
  string org_id = 1;
  bytes memory_content_hash = 2;
  reserved 3;
  reserved "serve_key";
  string contributor_id = 4;
  uint64 epoch = 5;
  reserved 6;
  reserved "nullifier";
  bool is_self_serve = 7;
  string model_id = 8;
  uint32 turn_count = 9;
  // Removed by the recall pivot — the keyword gate rejected 24/24 legitimate serves; RECALL-PIVOT-SPEC §8.2.
  reserved 10;
  reserved "matched_keywords";
  bytes serve_key_pubkey = 11;
  bytes fingerprint = 12;
  bytes episode_ref = 13;
}

// E2 block event record — serve_fingerprint is the serve_ref (RECALL-PIVOT-SPEC §3.1).
message StoredDenialReceipt {
  string org_id = 1;
  bytes memory_hash = 2;
  string deny_key = 3;
  string reason = 4;
  uint64 epoch = 5;
  reserved 6;
  reserved "nullifier";
  bytes serve_fingerprint = 7;
  bytes serve_key_pubkey = 8;
  // E2 contextual-suppression anchor (need-card embedding). INERT — schema slot only; population is REJECTED pending Walter's READ-disclosure ruling (RECALL-PIVOT-SPEC §4). Must be empty.
  bytes neg_anchor = 9;
}

message StoredEpochServeStats {
  string org_id = 1;
  uint64 epoch = 2;
  uint64 total_serves = 3;
  uint64 unique_memories_served = 4;
  uint64 unique_serve_keys = 5;
  uint64 self_serves = 6;
  map<string, uint64> model_breakdown = 7;
  uint64 total_denials = 8;
}

message StoredContributorEpochServes {
  string contributor_id = 1;
  uint64 epoch = 2;
  uint64 serve_count = 3;
  uint64 self_serve_count = 4;
  repeated string org_ids = 5;
  uint64 total_turns = 6;
}

syntax = "proto3";
package wevibe.bandwidth.v1;

option go_package = "github.com/wevibe-network/wevibe-chain/x/bandwidth/types";

import "cosmos/msg/v1/msg.proto";
import "wevibe/bandwidth/v1/params.proto";

service Msg {
  option (cosmos.msg.v1.service) = true;
  rpc SetBandwidthOverride(MsgSetBandwidthOverride) returns (MsgSetBandwidthOverrideResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSetBandwidthOverride {
  option (cosmos.msg.v1.signer) = "signer";
  string signer = 1;
  string org_id = 2;
  uint64 memory_cap = 3;
  uint64 serve_cap = 4;
}

message MsgSetBandwidthOverrideResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  string authority = 1;
  Params params = 2;
}

message MsgUpdateParamsResponse {}